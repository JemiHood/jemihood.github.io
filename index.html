<style>
  :root{
    --bg:#0b0f17; --bg-2:#111827; --card:#141b2b; --border:#1f2a3d;

  }
  [data-theme="light"]{
    --bg:#f7f8fb; --bg-2:#eef1f6; --card:#ffffff; --border:#e2e7ef;
    --text:#131a26; --muted:#5b6679; --accent:#d0603f; --accent-2:#e07a5f;
    --shadow:0 10px 30px rgba(20,30,50,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);line-height:1.65;transition:background .3s,color .3s}
  [dir="rtl"] body{font-family:'Cairo',sans-serif}
  a{color:inherit;text-decoration:none}
  .container{max-width:1100px;margin:0 auto;padding:0 20px}

  /* Nav */
  nav{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
  .nav-inner{display:flex;align-items:center;justify-content:space-between;height:66px}
  .logo{font-weight:800;font-size:1.25rem;letter-spacing:.5px}
  .logo span{color:var(--accent)}
  .links{display:flex;gap:26px;font-size:.93rem;color:var(--muted)}
  .links a:hover{color:var(--text)}
  .controls{display:flex;gap:8px}
  .btn-icon{border:1px solid var(--border);background:var(--card);color:var(--text);height:38px;min-width:38px;padding:0 12px;border-radius:10px;cursor:pointer;font-weight:600;font-family:inherit;font-size:.85rem}
  .btn-icon:hover{border-color:var(--accent)}

  /* Hero */
  .hero{padding:110px 0 90px;position:relative;overflow:hidden}
  .hero::before{content:"";position:absolute;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,var(--accent) 0%,transparent 70%);opacity:.14;top:-160px;inset-inline-end:-120px}
  .hero-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:50px;align-items:center}
  .badge{display:inline-block;padding:6px 14px;border:1px solid var(--border);border-radius:99px;font-size:.82rem;color:var(--muted);margin-bottom:22px;background:var(--card)}
  .badge::before{content:"●";color:#3ecf8e;margin-inline-end:8px}
  h1{font-size:clamp(2.2rem,5vw,3.5rem);line-height:1.15;font-weight:800;margin-bottom:18px}
  h1 .grad{background:linear-gradient(90deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero p{color:var(--muted);font-size:1.08rem;max-width:560px;margin-bottom:32px}
  .cta{display:flex;gap:12px;flex-wrap:wrap}
  .btn{padding:13px 24px;border-radius:12px;font-weight:600;font-size:.95rem;transition:transform .2s}
  .btn:hover{transform:translateY(-2px)}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-ghost{border:1px solid var(--border);background:var(--card)}
  .avatar{width:100%;max-width:330px;aspect-ratio:1;margin-inline-start:auto;border-radius:32px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:grid;place-items:center;font-size:6rem;font-weight:800;color:#fff;box-shadow:var(--shadow);overflow:hidden}
  .avatar img{width:100%;height:100%;object-fit:cover;font-size:1rem}

  /* Sections */
  section{padding:80px 0}
  .alt{background:var(--bg-2)}
  .eyebrow{color:var(--accent);font-weight:700;font-size:.82rem;letter-spacing:2px;text-transform:uppercase;margin-bottom:8px}
  [dir="rtl"] .eyebrow{letter-spacing:0}
  h2{font-size:clamp(1.7rem,3.5vw,2.3rem);font-weight:800;margin-bottom:40px}
  .about{display:grid;grid-template-columns:1.5fr 1fr;gap:40px}
  .about p{color:var(--muted);margin-bottom:14px;font-size:1.02rem}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .stat{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px}
  .stat b{display:block;font-size:1.8rem;color:var(--accent)}
  .stat span{color:var(--muted);font-size:.88rem}

  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:26px;transition:border-color .2s,transform .2s}
  .card:hover{border-color:var(--accent);transform:translateY(-3px)}
  .card .ico{font-size:1.6rem;margin-bottom:12px}
  .card h3{font-size:1.1rem;margin-bottom:8px}
  .card p{color:var(--muted);font-size:.94rem}

  .timeline{position:relative;padding-inline-start:28px;border-inline-start:2px solid var(--border)}
  .job{position:relative;margin-bottom:34px}
  .job::before{content:"";position:absolute;inset-inline-start:-36px;top:6px;width:14px;height:14px;border-radius:50%;background:var(--accent);border:3px solid var(--bg)}
  .alt .job::before{border-color:var(--bg-2)}
  .job h3{font-size:1.12rem}
  .job .meta{color:var(--accent);font-size:.88rem;font-weight:600;margin:2px 0 8px}
  .job p{color:var(--muted);font-size:.95rem}

  .skills{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .tag{padding:7px 14px;border-radius:99px;background:var(--bg-2);border:1px solid var(--border);font-size:.85rem}
  .alt .tag{background:var(--bg)}

  .contact{text-align:center}
  .contact p{color:var(--muted);max-width:520px;margin:-24px auto 32px}
  .contact-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;max-width:880px;margin:0 auto}
  .contact-grid a{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px;transition:border-color .2s}
  .contact-grid a:hover{border-color:var(--accent)}
  .contact-grid .ico{font-size:1.5rem}
  .contact-grid small{color:var(--muted);direction:ltr;unicode-bidi:plaintext}

  footer{padding:30px 0;text-align:center;color:var(--muted);font-size:.85rem;border-top:1px solid var(--border)}

  @media (max-width:820px){
    .links{display:none}
    .hero{padding:70px 0 60px}
    .hero-grid,.about,.skills{grid-template-columns:1fr}
    .avatar{max-width:220px;margin:0 auto;font-size:4rem;order:-1}
  }
</style>
</head>

  }).join("");

  document.getElementById("itSkills").innerHTML = IT_SKILLS.map(s => `<span class="tag">${s}</span>`).join("");
  document.getElementById("uxSkills").innerHTML = UX_SKILLS.map(s => `<span class="tag">${s}</span>`).join("");
}

function initLinks(){
  const email = document.getElementById("cEmail");
  email.href = "mailto:" + CONTACT.email; email.querySelector("small").textContent = CONTACT.email;
  const wa = document.getElementById("cWhatsapp");
  wa.href = "https://wa.me/" + CONTACT.whatsapp; wa.querySelector("small").textContent = "+" + CONTACT.whatsapp;
  document.getElementById("cLinkedin").href = CONTACT.linkedin;
  document.getElementById("cBehance").href  = CONTACT.behance;
  document.getElementById("behanceBtn").href = CONTACT.behance;
  document.getElementById("year").textContent = new Date().getFullYear();
}

document.getElementById("langBtn").onclick  = () => { lang  = lang  === "en" ? "ar" : "en"; store.set("lang", lang); render(); };
document.getElementById("themeBtn").onclick = () => { theme = theme === "dark" ? "light" : "dark"; store.set("theme", theme); render(); };

initLinks();
render();
</script>
</body>
</html>
